# 하네스 게이트 — ywr-harness 플러그인이 스캐폴드로 배치한 CI. 이 파일과 scripts/harness/*.py 는
# TOOLCHAIN 이므로 손으로 고치지 말 것: /ywr-harness:harness-init 재실행이 정본에서 덮어쓴다
# (ywr-harness ADR 0010 — 하네스 결함은 정본에서 고친다).
#
# 왜 reusable workflow(`on: workflow_call`)가 아니고 벤더링인가:
#   정본 레포는 private 이고 조직 간 Actions 접근이 access_level=none 이다. reusable workflow 로
#   가려면 그 설정을 조직 전체로 넓혀야 하는데, 그건 이 레포의 워크플로와 액션을 조직 내 어느
#   레포에서나 호출할 수 있게 만드는 권한 확대다. 빌더에 대해 이미 "복사 + 갱신 경로"를 택했으므로
#   (ADR 0011) 같은 방식으로 통일한다. 전파는 harness-init 재실행이고, 정본 사본과의 바이트
#   동일성은 플러그인의 manifest-gate 가 강제한다.
#
# 이 워크플로가 하는 일은 결정론 게이트를 **출력**하고 그중 실행 가능한 것을 돌리는 것이다.
# emitter 는 아무것도 실행하지 않으므로, 실제 린트/테스트는 아래 run 스텝이 emitter 의 출력을
# 받아 수행한다 — 무엇이 돌았고 무엇이 안 돌았는지가 로그에 남는 게 요점이다.

name: harness-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 0 = 전체 히스토리. emitter 가 --range 로 슬라이스 범위를 계산할 수 있어야 한다.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ADR 0043. 범위 해석의 단일 소스 — 스텝마다 인라인으로 조립하던 범위 문자열(감사 H1 의
      # 트리거 표면)을 벤더링된 resolve-base.sh 로 교체한다. PR 이벤트만 diff 범위를 가진다:
      # push/dispatch 는 ADR 0041 이후 전체 트리 감사(--all / --coverage)라 범위 자체가 없다.
      # blocking 모드: base 를 해석 못 한 PR 런은 이 스텝에서 실패다 — 검사가 돌지 않은 머지는
      # 통과가 아니다(ADR 0041 과 같은 원칙). 값은 env 로만 전달한다 — 워크플로 표현식을 run:
      # 텍스트에 전개하지 않는다(셸 주입 표면). 출력 base 는 검증된 40-hex SHA 이므로 아래
      # 스텝들이 범위 문자열로 안전하게 조립한다.
      - name: Resolve the PR diff base (single resolver — ADR 0043)
        id: base
        if: github.event_name == 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MODE: blocking
        run: |
          if [ ! -f scripts/harness/resolve-base.sh ]; then
            echo "::error::scripts/harness/resolve-base.sh 없음 — /ywr-harness:harness-init 재실행으로 배치하세요(ADR 0043)."
            exit 1
          fi
          sh scripts/harness/resolve-base.sh

      # ADR 0041. 시크릿 스캔의 CI 백스톱. .githooks/pre-push 가 패턴의 단일 소유자이므로 CI 는
      # 같은 스크립트를 이 런의 범위로 구동한다 — 패턴을 복제하지 않는다(두 사본은 어긋나는 길이다).
      # 이 스텝은 의도적으로 resolve-base.sh 를 쓰지 않는다(ADR 0043 옵션 C 기각): 스캔 범위는
      # rev-list 집합 차이라 비조상 base 도 유효하고, push 의 ZERO 폴백은 resolve-base 의 HEAD~1
      # 강등보다 더 많이 스캔한다 — 통일이 강한 쪽을 약화시키는 방향이다.
      # core.hooksPath 는 클론별 수동 배선이라(ADR 0015) 배선 안 된 클론의 푸시는 로컬 스캔이 0회다;
      # 여기가 커버리지의 바닥이다. PR: base 를 해석 못 하면 이 스텝은 실패다 — 스캔이 돌지 않은
      # 머지는 통과가 아니다. push: before 가 0(브랜치 생성)이거나 도달 불가(force push)면 훅의
      # new-branch 분기로 떨어져 리모트에 없는 커밋을 스캔한다. 훅은 스캔한 커밋 수를 출력하고,
      # 범위에 커밋이 0개면 조용히 exit 0 하므로 아래서 빈 출력을 보고로 바꾼다(무음 아님).
      - name: Secret scan over this run's commits (backstop)
        run: |
          if [ ! -f .githooks/pre-push ]; then
            echo "::warning::.githooks/pre-push 없음 — 시크릿 스캔 백스톱 생략(보고됨, 무음 아님). /ywr-harness:harness-init 재실행으로 배치하세요."
            exit 0
          fi
          ZERO=0000000000000000000000000000000000000000
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=$(git rev-parse "origin/${{ github.base_ref }}") || {
              echo "::error::secret scan: origin/${{ github.base_ref }} 를 해석할 수 없습니다 — 스캔이 돌지 않은 머지는 통과가 아닙니다(ADR 0041)."
              exit 1
            }
          else
            BASE="${{ github.event.before }}"
            case "$BASE" in
              *[!0]* ) git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=$ZERO ;;
              * ) BASE=$ZERO ;;
            esac
          fi
          # HEAD 를 먼저, 실패는 실패로: 인라인 $(git rev-parse HEAD) 가 실패하면 빈 문자열이
          # 끼어들어 stdin 이 3토큰이 되고, 훅은 4필드 계약이 깨진 채 조용히 0커밋을 스캔한다
          # (리뷰 2026-08-10, low — 재현됨). 스캔이 돌지 않은 런은 통과가 아니다.
          HEAD_SHA=$(git rev-parse HEAD) || {
            echo "::error::secret scan: HEAD 를 해석할 수 없습니다 — 스캔이 돌지 않은 런은 통과가 아닙니다(ADR 0041)."
            exit 1
          }
          RC=0
          OUT=$(printf 'refs/ci %s refs/ci %s\n' "$HEAD_SHA" "$BASE" | sh .githooks/pre-push) || RC=$?
          printf '%s\n' "$OUT"
          [ -n "$OUT" ] || echo "secret scan: 이 범위에 새 커밋 0개 — 스캔할 내용이 없었습니다(보고됨, 무음 아님)."
          exit $RC

      # emitter 는 스코프 해석에 실패하면 exit 0 이 아니라 stdout 의 `scope: FAILED` 마커와 함께
      # 비영으로 종료한다(ADR 0041) — pipefail 이 그 종료 코드를 이 스텝의 실패로 만든다. 침묵한
      # 빈 출력은 아래 grep 스텝 전부를 초록으로 통과시키는, 가장 나쁜 형태의 공회전이었다.
      #
      # push/dispatch 는 --all(전체 트리 감사)로 돈다: 파티션(ungrouped)과 아티팩트 규칙은 diff 가
      # 아니라 트리의 속성이고, 각각 green 인 두 PR 이 병합으로 만든 main 상태는 어떤 PR 런도 본
      # 적이 없다(ADR 0041). 리뷰 티어 줄은 감사 모드 문구로 바뀌지만 `review tier:` 접두는
      # 유지된다 — 아래 sed 의 윈도 종결 문장이다.
      # base 는 env 로만 받는다 — 이 파일의 resolver 스텝이 스스로 세운 규칙(표현식을 run: 텍스트에
      # 전개하지 않는다)은 그 스텝의 출력에도 적용된다(리뷰 2026-08-10 med). 값은 resolver 가
      # 정규화한 40-hex SHA 또는 빈 문자열이지만, 패턴 자체를 남기지 않는 쪽이 규칙이다.
      - name: Emit deterministic gates and the review tier
        id: emit
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -o pipefail
          if [ -n "$BASE" ]; then
            python scripts/harness/harness_gates.py --range "$BASE..HEAD" | tee "$RUNNER_TEMP/gates.txt"
          else
            python scripts/harness/harness_gates.py --all | tee "$RUNNER_TEMP/gates.txt"
          fi

      # gates.txt lives in RUNNER_TEMP, NOT the working tree. The emitter's scope includes
      # untracked files, and `tee` creates its output file before the emitter enumerates them —
      # so an in-tree gates.txt makes this job report its OWN output as an ungrouped file and
      # fail. Every scaffolded repo would hit it on the first CI run. Measured 2026-07-27 on
      # this workflow's first execution.
      - name: Fail on ungrouped files
        run: |
          # 그룹이 청구하지 않은 파일은 어떤 결정론 게이트도 덮지 않는다. 조용히 넘기면 커버리지가
          # 있는 것처럼 읽히므로, 선언을 고치거나 의도적으로 예외 처리하도록 CI 에서 막는다.
          if grep -q '^ungrouped (' "$RUNNER_TEMP/gates.txt"; then
            echo "::error::선언된 그룹이 청구하지 않은 파일이 있습니다 — .harness.json 의 groups 를 보완하세요."
            sed -n '/^ungrouped (/,$p' "$RUNNER_TEMP/gates.txt"
            exit 1
          fi
          echo "OK — 모든 변경 파일이 선언된 그룹에 속합니다."

      # ADR 0032. .harness.json 이 아티팩트를 선언하면 README 는 그 링크를 실어야 하고, 선언된
      # 제목은 레포 이름으로 시작해야 한다(<repo> · <purpose>). emitter 는 보고만 하므로 여기가
      # 시행 지점이다. 미선언이면 emitter 가 "none declared" 로 보고하고 이 스텝은 통과한다.
      - name: Fail on a declared-artifact violation
        run: |
          if grep -q '^artifact: VIOLATION' "$RUNNER_TEMP/gates.txt"; then
            echo "::error::선언된 아티팩트 규칙 위반 — .harness.json 의 artifacts 선언과 README 를 맞추세요 (ywr-harness ADR 0032)."
            grep '^artifact:' "$RUNNER_TEMP/gates.txt"
            exit 1
          fi
          echo "OK — 아티팩트 위반 없음(선언 여부는 emitter 의 artifact: 라인이 보고)."

      # ADR 0022(0021 대체). enabledPlugins 가 커밋되면 이 레포를 클론하는 전원에게 플러그인이 강제
      # 활성화된다 — 관리 설정 페이로드에서 끝까지 쓰지 않은 바로 그 키다(ADR 0010/0012). 트리에
      # 쓰는 스코프는 둘 다 막는다: --scope project 는 .claude/settings.json, --scope local 은
      # .claude/settings.local.json 에 쓴다(측정값. 0021 은 전자만 막고 후자를 해법으로 안내했다).
      # 파일 자체는 공유 설정의 정당한 자리이므로 금지하지 않고, 키만 값과 무관하게 막는다 —
      # 언인스톨이 `{"enabledPlugins": {}}` 를 남기므로 빈 값도 커밋 대상이 아니다.
      #
      # 훅과 달리 여기서는 JSON 으로 파싱한다. `"enabledPlugins"` 는 RFC 8259 상 동일한 키이고
      # 호스트도 그렇게 읽지만 리터럴 grep 은 놓친다. 훅은 인터프리터 없이 도는 바닥이고(ADR 0015)
      # 실효 백스톱은 core.hooksPath 에 의존하지 않는 이 스텝이다.
      - name: Fail on a committed enabledPlugins
        run: |
          python - <<'PY'
          import json, subprocess, sys

          TARGETS = [".claude/settings.json", ".claude/settings.local.json"]
          tracked = [p for p in subprocess.run(
              ["git", "ls-files", "-z", "--"] + TARGETS,
              capture_output=True, text=True, check=True).stdout.split("\0") if p]

          bad = []
          for path in tracked:
              with open(path, encoding="utf-8") as fh:
                  raw = fh.read()
              try:
                  data = json.loads(raw)
              except json.JSONDecodeError as exc:
                  # 파싱 실패를 통과로 처리하지 않는다 — 검사하지 못한 것과 위반이 없는 것은 다르다.
                  print(f"::error::{path} 를 파싱할 수 없어 enabledPlugins 여부를 확인하지 못했습니다: {exc}")
                  sys.exit(1)
              if isinstance(data, dict) and "enabledPlugins" in data:
                  bad.append(path)

          if bad:
              for path in bad:
                  print(f"::error::{path} 이 enabledPlugins 를 선언합니다 — 클론하는 전원에게 플러그인이 강제됩니다(ADR 0010/0022).")
              print("고치는 법: git rm --cached <파일> 후 git 에서 제외하거나, 플러그인을 언인스톨하고 설치를 각 구성원의 선택으로 두세요.")
              print("--scope project 와 --scope local 모두 이 키를 트리에 쓰므로 다른 스코프로 재설치하는 것은 해결이 아닙니다.")
              sys.exit(1)

          print(f"OK — 커밋된 enabledPlugins 없음(추적 중인 대상 {len(tracked)}개 검사).")
          PY

      - name: Run the emitted gate commands
        run: |
          # emitter 는 출력만 한다. 여기서 실제로 돌린다 — 한 줄이라도 실패하면 잡을 수 있게
          # 순차 실행하고, 무엇을 돌렸는지 로그에 남긴다.
          set -euo pipefail
          # `[^ (]` 가 중요하다: emitter 는 매치된 파일이 있는데 gates 가 비어 있는 그룹에 대해
          # "    (no gate declared for this group — ...)" 를 같은 4칸 들여쓰기로 출력한다. 이건
          # 명령이 아니라 주석문이라 sh 로 넘기면 서브셸이 되어 "no: command not found" 로 죽는다.
          # 스캐폴드가 배치하는 기본 .harness.json 의 example 그룹이 정확히 그 모양이므로,
          # 괄호로 시작하는 줄은 명령 목록에서 제외한다.
          cmds=$(sed -n '/^gates:/,/^\(ungrouped\|review tier\)/p' "$RUNNER_TEMP/gates.txt" \
                 | grep -E '^ {4}[^ (]' | sed 's/[[:space:]]*#.*$//' | sed 's/^[[:space:]]*//' || true)
          # `|| true` is load-bearing under `set -euo pipefail`. When no group declares a gate — or
          # no changed file matches a gate-bearing group — grep matches nothing and exits 1,
          # pipefail propagates it, and `set -e` kills this step BEFORE the branch below can report
          # cleanly. That branch was unreachable for exactly the repos it was written for. Measured
          # 2026-07-27: this canon declares `gates: []` everywhere and CI failed on it.
          if [ -z "$cmds" ]; then
            echo "실행할 결정론 게이트가 없습니다(선언된 그룹이 매치되지 않았거나 gates 가 비어 있음)."
            exit 0
          fi
          echo "$cmds" | while IFS= read -r c; do
            [ -n "$c" ] || continue
            echo "::group::$c"
            sh -c "$c"
            echo "::endgroup::"
          done

      - name: Slice retro over the PR range (advisory, report-only)
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          # ADR 0017. 로컬 post-commit 훅과 같은 스크립트를 PR 범위 전체에 돌린다 — 범위 모드는
          # "코드 커밋 먼저, 문서 커밋 나중" 같은 슬라이스 중간 오탐을 흡수하므로 여기서 남는
          # 발견은 실제로 슬라이스가 닫히지 않았다는 뜻이다. 리포트 전용: 실패시키지 않는다.
          if [ -f scripts/harness/harness_retro.py ]; then
            if [ -n "$BASE" ]; then
              python scripts/harness/harness_retro.py "$BASE..HEAD" || true
            else
              python scripts/harness/harness_retro.py --coverage || true
            fi
          else
            echo "harness_retro.py 없음 — /ywr-harness:harness-init 재실행으로 배치(보고됨, 무음 아님)."
          fi

      - name: Map changed files to spec-owned verify scripts (advisory)
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          if [ -n "$BASE" ]; then
            python scripts/harness/verify_map.py --range "$BASE..HEAD"
          else
            python scripts/harness/verify_map.py
          fi

      # ADR 0043. 이전 형태는 두 가지가 약했다: ① `git diff ... | grep -q .` 는 git 실패를
      # "docs 변경 없음"으로 읽어 드리프트 검사를 조용히 생략했고(H1 급), ② push 는
      # HEAD~1..HEAD 만 봐서 여러 커밋 push 의 앞 커밋 docs 변경을 놓쳤다. 지금: PR 은 검증된
      # base 범위로 스킵 판정(diff 실패는 실패), push/dispatch 는 무조건 재빌드 — 트리 감사와
      # 같은 원칙(ADR 0041)이고, 각각 green 인 두 PR 이 병합으로 만든 중복 id 는 빌더의
      # 결정론적 거부(ADR 0043)가 바로 여기서 main 을 빨갛게 만든다.
      - name: Docs index drift (PR — when docs sources changed · push/dispatch — always)
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          if [ ! -f docs/build_docs.py ]; then
            echo "docs/build_docs.py 없음 — 드리프트 검사 생략(보고됨, 무음 아님)."
            exit 0
          fi
          if [ -n "$BASE" ]; then
            CHANGED=$(git diff --name-only "$BASE..HEAD" -- docs/) || {
              echo "::error::docs 드리프트: 변경 파일 해석에 git 이 실패했습니다 — 검사가 돌지 않은 런은 통과가 아닙니다(ADR 0041)."
              exit 1
            }
            if [ -z "$CHANGED" ]; then
              echo "docs 소스 변경 없음 — 드리프트 검사 생략(보고됨, 무음 아님)."
              exit 0
            fi
          fi
          # stdout 만 버린다 — 빌더의 결정론적 거부(중복 id 등)는 stderr 로 나오고 그대로 보인다.
          python docs/build_docs.py >/dev/null || {
            echo "::error::docs 빌드 실패 — 빌더의 결정론적 거부(중복 id 등, ADR 0043)거나 소스 오류입니다. 위 stderr 를 보세요."
            exit 1
          }
          if [ -n "$(git status --porcelain docs/index.json docs/INDEX.md)" ]; then
            echo "::error::docs/index.json 또는 docs/INDEX.md 가 소스와 어긋났습니다(드리프트). 로컬에서 pwsh docs/build.ps1 후 커밋하세요."
            git --no-pager diff -- docs/index.json docs/INDEX.md
            exit 1
          fi
          echo "OK — 커밋된 index 가 소스와 일치합니다."
